<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Rover Navigation</title>
    <!-- MQTT.js via CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: #0066cc;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
        }

        .status.connected {
            background: #28a745;
        }

        .status.disconnected {
            background: #dc3545;
        }

        .canvas-wrapper {
            flex: 1;
            position: relative;
            background: white;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .info-panel {
            background: white;
            padding: 15px;
            border-top: 1px solid #ddd;
            font-size: 14px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .info-label {
            font-weight: bold;
            color: #666;
        }

        .rover-value {
            color: #cc0000;
        }

        .msg-counter {
            font-size: 11px;
            color: #999;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <span>🚗 Rover Navigation</span>
        <span class="status disconnected" id="mqtt-status">offline</span>
    </div>

    <div class="canvas-wrapper">
        <canvas id="map"></canvas>
    </div>

    <div class="info-panel">
        <div class="info-row">
            <span class="info-label">Rover Position:</span>
            <span class="info-value rover-value" id="rover-pos">-</span>
        </div>
        <div class="info-row">
            <span class="info-label">Ziel:</span>
            <span class="info-value" id="target-pos">-</span>
        </div>
        <div class="msg-counter">MQTT-Nachrichten: <span id="msg-count">0</span></div>
    </div>
</div>


<script>
    const canvas = document.getElementById('map');
    const ctx = canvas.getContext('2d');
    let currentState = null;
    let currentBounds = null;
    let messageCount = 0;

    // ===== Canvas-Größe anpassen =====
    function resizeCanvas() {
        const wrapper = canvas.parentElement;
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
        if (currentState) drawMap(currentState);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ===== Bounds-Berechnung (MUSS vor MQTT stehen!) =====
    function calculateTargetBounds(state) {
        // 🎯 Nur Rover als Zentrum, fester Radius von 3 Metern
        const roverX = state.rover.x;
        const roverY = state.rover.y;
        const radius = 10;  // 5 Meter in jede Richtung

        return {
            minX: roverX - radius,
            maxX: roverX + radius,
            minY: roverY - radius,
            maxY: roverY + radius,
            width: radius * 2,
            height: radius * 2
        };
    }


    function xcalculateTargetBounds(state) {
        const points = [
            state.point_a,
            state.point_b,
            state.rover,
            state.ladepunkt,
            state.einfahrt,
            state.anfahrt

        ];

        // 🎯 Polygon-Punkte hinzufügen
        if (state.polygon && state.polygon.length > 0) {
            points.push(...state.polygon);
        }
        // 🎯 Leitlinie-Punkte hinzufügen
        if (state.guideline && state.guideline.length > 0) {
            points.push(...state.guideline);
        }
        // 🎯 Donelinie-Punkte hinzufügen
        if (state.doneline && state.doneline.length > 0) {
            points.push(...state.doneline);
        }
        // 🎯 Worklinie-Punkte hinzufügen
        if (state.workline && state.workline.length > 0) {
            points.push(...state.workline);
        }

        // 🎯 Blocklinie-Punkte hinzufügen
        if (state.blockline && state.blockline.length > 0) {
            points.push(...state.blockline);
        }


        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;

        points.forEach(p => {
            minX = Math.min(minX, p.x);
            maxX = Math.max(maxX, p.x);
            minY = Math.min(minY, p.y);
            maxY = Math.max(maxY, p.y);
        });

        const width = maxX - minX || 1;
        const height = maxY - minY || 1;
        const padding = 0.15;

        return {
            minX: minX - width * padding,
            maxX: maxX + width * padding,
            minY: minY - height * padding,
            maxY: maxY + height * padding,
            width: width * (1 + 2 * padding),
            height: height * (1 + 2 * padding)
        };
    }


    // ===== MQTT Verbindung =====
    const brokerUrl = `ws://192.168.10.51:9001`;
    const topic = 'rover/posi';
    const client = mqtt.connect(brokerUrl, {
        reconnectPeriod: 1000,
        connectTimeout: 5000
    });

    const statusEl = document.getElementById('mqtt-status');

    client.on('connect', () => {
        statusEl.textContent = 'online';
        statusEl.classList.remove('disconnected');
        statusEl.classList.add('connected');
        client.subscribe(topic);
    });

    client.on('message', (receivedTopic, message) => {
        try {
            currentState = JSON.parse(message.toString());
            messageCount++;
            document.getElementById('msg-count').textContent = messageCount;

            const targetBounds = calculateTargetBounds(currentState);

            if (!currentBounds) {
                currentBounds = targetBounds;
            } else {
                // Konstantes Smoothing - funktioniert immer
                const SMOOTHING = 0.05;

                currentBounds = {
                    minX: currentBounds.minX + (targetBounds.minX - currentBounds.minX) * SMOOTHING,
                    maxX: currentBounds.maxX + (targetBounds.maxX - currentBounds.maxX) * SMOOTHING,
                    minY: currentBounds.minY + (targetBounds.minY - currentBounds.minY) * SMOOTHING,
                    maxY: currentBounds.maxY + (targetBounds.maxY - currentBounds.maxY) * SMOOTHING,
                    width: 0,
                    height: 0
                };
                currentBounds.width = currentBounds.maxX - currentBounds.minX;
                currentBounds.height = currentBounds.maxY - currentBounds.minY;
            }

            drawMap(currentState);
        } catch (e) {
            console.error('Parse-Fehler:', e);
        }
    });

    client.on('offline', () => {
        statusEl.textContent = 'offline';
        statusEl.classList.remove('connected');
        statusEl.classList.add('disconnected');
    });

    // ===== Welt-zu-Bildschirm-Konvertierung =====
    function worldToScreen(x, y, bounds) {
        const pixelPadding = 30;
        const usableWidth = canvas.width - 2 * pixelPadding;
        const usableHeight = canvas.height - 2 * pixelPadding;

        const scaleX = usableWidth / bounds.width;
        const scaleY = usableHeight / bounds.height;
        const scale = Math.min(scaleX, scaleY);

        const offsetX = pixelPadding + (usableWidth - bounds.width * scale) / 2;
        const offsetY = pixelPadding + (usableHeight - bounds.height * scale) / 2;

        return {
            x: (x - bounds.minX) * scale + offsetX,
            y: canvas.height - ((y - bounds.minY) * scale + offsetY)
        };
    }

    // ===== Adaptives Gitter =====
    function drawGrid(bounds) {
        ctx.strokeStyle = '#e8e8e8';
        ctx.lineWidth = 1;

        const range = Math.max(bounds.width, bounds.height);
        let gridStep = Math.pow(10, Math.floor(Math.log10(range / 5)));

        const startX = Math.floor(bounds.minX / gridStep) * gridStep;
        const startY = Math.floor(bounds.minY / gridStep) * gridStep;

        for (let x = startX; x <= bounds.maxX; x += gridStep) {
            const p1 = worldToScreen(x, bounds.minY, bounds);
            const p2 = worldToScreen(x, bounds.maxY, bounds);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }

        for (let y = startY; y <= bounds.maxY; y += gridStep) {
            const p1 = worldToScreen(bounds.minX, y, bounds);
            const p2 = worldToScreen(bounds.maxX, y, bounds);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }
    }

    // Polygon-Zeichenfunktion:
    function drawPolygon(points, bounds) {
        if (!points || points.length < 2) return;

        ctx.beginPath();
        const first = worldToScreen(points[0].x, points[0].y, bounds);
        ctx.moveTo(first.x, first.y);

        for (let i = 1; i < points.length; i++) {
            const p = worldToScreen(points[i].x, points[i].y, bounds);
            ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();

        // Füllung
        ctx.fillStyle = '#B5E4CE4D';
        ctx.fill();

        // Rand
        ctx.strokeStyle = '#009650';
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    // Leitlinie-Zeichenfunktion:
    function drawGuideline(points, bounds) {
        if (!points || points.length < 2) return;

        ctx.beginPath();
        const first = worldToScreen(points[0].x, points[0].y, bounds);
        ctx.moveTo(first.x, first.y);

        for (let i = 1; i < points.length; i++) {
            const p = worldToScreen(points[i].x, points[i].y, bounds);
            ctx.lineTo(p.x, p.y);
        }

        // Keine Füllung, nur Linie
        //ctx.strokeStyle = '#ff8800';  // Orange
        ctx.strokeStyle = '#9900cc'; // Lila, gepunktet
        ctx.lineWidth = 4;
        //ctx.setLineDash([10, 5]);  // Gestrichelt
        //ctx.setLineDash([3, 3]); //gepunktet
        ctx.stroke();
        ctx.setLineDash([]);

        // Punkte an den Ecken zeichnen
        //ctx.fillStyle = '#ff8800';
        ctx.fillStyle = '#9900cc'; // Lila, gepunktet
        points.forEach(point => {
            const p = worldToScreen(point.x, point.y, bounds);
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
            ctx.fill();
        });
    }

    // Leitlinie-Zeichenfunktion:
    function drawDoneline(points, bounds) {
        if (!points || points.length < 2) return;

        ctx.beginPath();
        const first = worldToScreen(points[0].x, points[0].y, bounds);
        ctx.moveTo(first.x, first.y);

        for (let i = 1; i < points.length; i++) {
            const p = worldToScreen(points[i].x, points[i].y, bounds);
            ctx.lineTo(p.x, p.y);
        }

        // Keine Füllung, nur Linie
        //ctx.strokeStyle = '#ff8800';  // Orange
        ctx.strokeStyle = 'rgb(150 221 133)'; // Lila, gepunktet
        ctx.lineWidth = 4;
        //ctx.setLineDash([10, 5]);  // Gestrichelt
        //ctx.setLineDash([3, 3]); //gepunktet
        ctx.stroke();
        ctx.setLineDash([]);

        // Punkte an den Ecken zeichnen
        //ctx.fillStyle = '#ff8800';
        ctx.fillStyle = 'rgb(85 215 54)'; // Lila, gepunktet
        points.forEach(point => {
            const p = worldToScreen(point.x, point.y, bounds);
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
            ctx.fill();
        });
    }

    // Leitlinie-Zeichenfunktion:
    function drawWorkline(points, bounds) {
        if (!points || points.length < 2) return;

        ctx.beginPath();
        const first = worldToScreen(points[0].x, points[0].y, bounds);
        ctx.moveTo(first.x, first.y);

        for (let i = 1; i < points.length; i++) {
            const p = worldToScreen(points[i].x, points[i].y, bounds);
            ctx.lineTo(p.x, p.y);
        }

        // Keine Füllung, nur Linie
        //ctx.strokeStyle = '#ff8800';  // Orange
        ctx.strokeStyle = 'rgb(250 104 122)'; // Lila, gepunktet
        ctx.lineWidth = 4;
        //ctx.setLineDash([10, 5]);  // Gestrichelt
        //ctx.setLineDash([3, 3]); //gepunktet
        ctx.stroke();
        ctx.setLineDash([]);

        // Punkte an den Ecken zeichnen
        //ctx.fillStyle = '#ff8800';
        ctx.fillStyle = 'rgb(85 215 54)'; // Lila, gepunktet
        points.forEach(point => {
            const p = worldToScreen(point.x, point.y, bounds);
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
            ctx.fill();
        });
    }

    // Block-Zeichenfunktion:

    function drawBlockpoints(points, bounds) {
        if (!points || points.length < 2) return;

        ctx.beginPath();
        const first = worldToScreen(points[0].x, points[0].y, bounds);
        ctx.moveTo(first.x, first.y);

        for (let i = 1; i < points.length; i++) {
            const p = worldToScreen(points[i].x, points[i].y, bounds);
            // ctx.lineTo(p.x, p.y);
        }

        // Keine Füllung, nur Linie
        //ctx.strokeStyle = '#ff8800';  // Orange
        ctx.strokeStyle = 'rgb(250 104 122)'; // Lila, gepunktet
        ctx.lineWidth = 4;
        //ctx.setLineDash([10, 5]);  // Gestrichelt
        //ctx.setLineDash([3, 3]); //gepunktet
        ctx.stroke();
        ctx.setLineDash([]);

        // Punkte an den Ecken zeichnen
        //ctx.fillStyle = '#ff8800';
        ctx.fillStyle = 'rgb(246 7 36)'; // Lila, gepunktet
        points.forEach(point => {
            const p = worldToScreen(point.x, point.y, bounds);
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
            ctx.fill();
        });
    }

    function drawLP(point, bounds) {
        const p = worldToScreen(point.x, point.y, bounds);
        ctx.fillStyle = '#55d736';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1, 0, 2 * Math.PI);
        ctx.fill();
        // Batterie-Emoji
        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🔋', p.x, p.y);


        //ctx.fillStyle = 'white';
        //ctx.fillText('L', p.x, p.y);
    }


    // ===== Canvas-Zeichnung =====
    function drawMap(state) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const bounds = currentBounds;

        drawGrid(bounds);

        // 🎯 Leitlinie zuerst zeichnen
        if (state.guideline) {
            drawGuideline(state.guideline, bounds);
        }
        // 🎯 Donelinie zuerst zeichnen
        if (state.doneline) {
            drawDoneline(state.doneline, bounds);
        }
        // 🎯 Worklinie zuerst zeichnen
        if (state.workline) {
            drawWorkline(state.workline, bounds);
        }

        // 🎯 Blocklinie zuerst zeichnen
        if (state.blockline) {
            drawBlockpoints(state.blockline, bounds);
        }

        // 🎯 Polygon zuerst zeichnen (liegt im Hintergrund)
        drawPolygon(state.polygon, bounds);


        // Sollstrecke
        const a = worldToScreen(state.point_a.x, state.point_a.y, bounds);
        const b = worldToScreen(state.point_b.x, state.point_b.y, bounds);

        ctx.strokeStyle = '#0066cc';
        ctx.lineWidth = 4;
        ctx.setLineDash([15, 10]);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.setLineDash([]);

        // Punkt A
        ctx.fillStyle = '#0066cc';
        ctx.beginPath();
        ctx.arc(a.x, a.y, 14, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('A', a.x, a.y);

        // Punkt B
        ctx.fillStyle = '#0066cc';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 8, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.fillText('B', b.x, b.y);

        // 🎯 Ladestation 3 punkte
        drawLP(state.ladepunkt, bounds);
        drawLP(state.einfahrt, bounds);
        drawLP(state.anfahrt, bounds);

        // Rover
        // In drawMap() den Rover-Abschnitt ersetzen:

// Rover mit Rotation
        const rover = worldToScreen(state.rover.x, state.rover.y, bounds);
        const angle = state.rover.angle || 0;  // Winkel in Grad, Default 0

// Dreieck-Punkte relativ zum Mittelpunkt (Spitze zeigt nach oben)
        const roverSize = 15;
        const trianglePoints = [
            {x: 0, y: -roverSize},           // Spitze (oben)
            {x: -roverSize * 0.8, y: roverSize * 0.8},  // links unten
            {x: roverSize * 0.8, y: roverSize * 0.8}    // rechts unten
        ];

// Rotationsmatrix anwenden
// Winkel in Bogenmaß umrechnen, -90° weil 0° = Norden (oben)
        const angleRad = angle * Math.PI / 180;
        const cos = Math.cos(angleRad);
        const sin = Math.sin(angleRad);

        ctx.fillStyle = '#cc0000';
        ctx.beginPath();

// Ersten Punkt rotieren und zeichnen
        const p0 = {
            x: rover.x + (trianglePoints[0].x * cos - trianglePoints[0].y * sin),
            y: rover.y + (trianglePoints[0].x * sin + trianglePoints[0].y * cos)
        };
        ctx.moveTo(p0.x, p0.y);

// Restliche Punkte rotieren
        for (let i = 1; i < trianglePoints.length; i++) {
            const p = {
                x: rover.x + (trianglePoints[i].x * cos - trianglePoints[i].y * sin),
                y: rover.y + (trianglePoints[i].x * sin + trianglePoints[i].y * cos)
            };
            ctx.lineTo(p.x, p.y);
        }

        ctx.closePath();
        ctx.fill();

// Weiße Umrandung
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Info
        document.getElementById('rover-pos').textContent =
            `(${state.rover.x.toFixed(1)}, ${state.rover.y.toFixed(1)})`;
        document.getElementById('target-pos').textContent =
            `(${state.point_b.x}, ${state.point_b.y})`;
    }
</script>
</body>
</html>
